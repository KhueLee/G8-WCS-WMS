<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>G8 WMS ảo</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="app">
  <aside><h1>G8 WMS ảo</h1><div class="ver" id="ver"></div><nav id="tabs"></nav><div class="conn" id="conn"></div></aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script src="/static/common.js"></script>
<script>
initTip();
let CFG = {};
async function loadCfg() {
  CFG = await api('/api/config');
  $('#ver').textContent = `v${CFG.version} · kho ${CFG.wh_code}`;
  $('#conn').innerHTML = `Zone lưu trữ: <b>${esc(CFG.store_zone)}</b>`;
}
loadCfg();
const lineOpts = pre => { const ks = Object.keys(CFG.stations || {}); const f = ks.filter(k => k.startsWith(pre)); return (f.length ? f : ks).map(k => `<option>${esc(k)}</option>`).join(''); };

async function send(e, path, build) {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target).entries());
  const body = build(fd); if (!body) return;
  const r = await api(path, body);
  toast(r.ok ? `Đã tạo lệnh ${r.order_id || ''} – xem tab Lệnh` : r, !r.ok);
}
const parseSteps = s => s.split(/[,\n]/).map(x => x.trim()).filter(Boolean).map(x => { const [a, b] = x.split('>').map(y => y.trim()); return {from: a, to: b}; });
function doBuild(f) {
  const picks = $$('#dop tbody tr').filter(tr => $('input[type=checkbox]', tr).checked)
    .map(tr => ({pallet_id: tr.dataset.p, ctn_need: +$('input[type=number]', tr).value}));
  if (!picks.length) { toast('Chọn ít nhất 1 pallet', true); return null; }
  return {belt: f.belt, picks};
}
async function cancelPo(po) { if (confirm('Hủy lệnh định danh ' + po + '?')) { const r = await api('/api/identify/cancel', {po_id: po}); toast(r.ok ? 'Đã gửi hủy' : r, !r.ok); } }

async function saveCfg() {
  const c = readFields($('#cfg'), {});
  c.users = Object.fromEntries(readTable('ut').filter(r => r.user).map(r => [r.user, r.password]));
  c.stations = Object.fromEntries(readTable('stt').filter(r => r.line_id).map(r => [r.line_id, r.location]));
  const r = done(await api('/api/settings', c, 'PUT'));
  if (r.ok) { await loadCfg(); render(); }
}

const render = tabs([['-', 'Tổng quan'], ['dash', 'Dashboard'],
  ['-', 'Đặt lệnh'], ['new_id', 'Định danh (PO / ASN)'], ['new_mv', 'Di chuyển pallet'], ['new_do', 'Xuất hàng (DO)'],
  ['-', 'Theo dõi'], ['orders', 'Lệnh'], ['pallets', 'Pallet / tồn kho'], ['locs', 'Vị trí'], ['events', 'Sự kiện'],
  ['-', 'Hệ thống'], ['outbox', 'Outbox'], ['msg', 'Bản tin'], ['cfg', 'Cấu hình']], async t => {
  if (t === 'dash') {
    const d = await api('/api/dashboard'), k = d.tiles, p = k.pallets || {};
    const byKind = Object.entries(k.orders_by_kind || {}).map(([a, b]) => `${a} ${b}`).join(' · ') || 'chưa có lệnh';
    return `<div class="tiles">
      ${tile('Lệnh hôm nay', fmt(k.orders_today), esc(byKind))}
      ${tile('Lệnh đang chạy', fmt(k.orders_running), '')}
      ${tile('Lệnh lỗi hôm nay', fmt(k.orders_failed), k.orders_failed ? '<span class="st crit"><i>▲</i>xem tab Lệnh</span>' : 'không có')}
      ${tile('Pallet trong kho', fmt(p.STORED || 0), `${fmt(p.IDENTIFIED || 0)} chờ cất · ${fmt(p.PLANNED || 0)} chờ định danh`)}
      ${tile(`Ô trống zone ${esc(d.store_zone)}`, fmt(k.zone_free), `${fmt(k.zone_full)}/${fmt(k.zone_total)} ô có hàng · ${fmt(k.zone_reserved)} đã giữ chỗ`)}
      ${tile('Pallet đã xuất hết', fmt(p.SHIPPED || 0), '')}
      ${tile('Bản tin chờ gửi WCS', fmt(k.outbox_pending), k.outbox_dead ? `<span class="st crit"><i>▲</i>${k.outbox_dead} bị từ chối</span>` : 'không có bản tin lỗi')}
    </div>
    <div class="grid2">
      <div class="card"><h3>Lệnh tạo theo giờ – hôm nay</h3>${hourBars(d.hourly_orders, 'lệnh')}</div>
      <div class="card"><h3>Pallet định danh xong theo giờ – hôm nay</h3>${hourBars(d.hourly_identified, 'pallet')}</div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Ô kệ theo zone</h3>${occupancy(d.occupancy)}<div class="hint" style="margin-top:8px">Bảng chi tiết: tab Vị trí</div></div>
      <div class="card"><h3>Sự kiện gần đây</h3>${table(d.events, [['Giờ', 't'], ['Sự kiện', 'text']])}</div>
    </div>`;
  }
  if (t === 'new_id') {
    const orders = (await api('/api/orders')).filter(o => ['PO', 'ASN'].includes(o.kind) && ['SENT', 'RUNNING'].includes(o.status));
    return `<div class="card"><h3>Sản xuất thành phẩm (PO) / nhập hàng thương mại (ASN)</h3>
    <div class="hint">WMS sinh mã thùng (Carton_List), gán ô trống trong zone ${esc(CFG.store_zone)} cho từng pallet rồi gửi lệnh cho WCS. Định danh xong sẽ tự gọi robot cất kệ nếu bật trong Cấu hình.</div>
    <form class="f" onsubmit="send(event,'/api/identify',f=>({...f, pallets:+f.pallets, cartons:+f.cartons, inner:+f.inner, gw:+f.gw}))">
     <label class="fl">Loại<select name=kind><option>PO</option><option>ASN</option></select></label>
     <label class="fl">Line<select name=line_id>${lineOpts('MCSX')}</select></label>
     <label class="fl">Mã SP<input name=item_code value="TRU_G01_50W_AT" required></label>
     <label class="fl">Tên SP<input name=item_name value="Bóng Led trụ nhôm T50" required style="min-width:220px"></label>
     <label class="fl">Số pallet<input name=pallets value=1 type=number min=1 max=50></label>
     <label class="fl">Thùng / pallet<input name=cartons value=6 type=number min=1></label>
     <label class="fl">Chiếc / thùng<input name=inner value=6 type=number min=1></label>
     <label class="fl">GW kg/thùng<input name=gw value=1.637 type=number step=any></label>
     <label class="fl">NSX (dd/mm/yyyy)<input name=mfg_date placeholder="mặc định hôm nay"></label>
     <button class="p">Gửi lệnh</button></form></div>
    <div class="card"><h3>Lệnh định danh đang chạy</h3>${table(orders, [['Lệnh', 'order_id'], ['Line', 'line_id'], ['TT', r => badge(r.status)],
      ['Xong', r => (r.done || []).length + '/' + (r.pallets || []).length, 'num'], ['', r => `<button class=a onclick="cancelPo(${r.po_id})">Hủy</button>`]])}</div>`;
  }
  if (t === 'new_mv') {
    const ps = (await api('/api/pallets')).filter(p => p.location);
    return `<div class="card"><h3>Di chuyển pallet</h3>
    <div class="hint">Mỗi bước dạng <code>TỪ&gt;ĐẾN</code>; nhiều bước cách nhau dấu phẩy → WCS chạy tuần tự (Task_ID 1/n … n/n).</div>
    <form class="f" onsubmit="send(event,'/api/move',f=>({pallet_id:f.pallet_id, type_robot:+f.type_robot, type_move:+f.type_move, steps:parseSteps(f.steps)}))">
     <label class="fl">Pallet<input name=pallet_id list="pl" required placeholder="LPNB00001"><datalist id="pl">${ps.map(p => `<option value="${esc(p.pallet_id)}">${esc(p.location)}</option>`).join('')}</datalist></label>
     <label class="fl" style="flex:1">Các bước<input name=steps required placeholder="S02-250-1>S02-251-1" style="min-width:300px"></label>
     <label class="fl">Robot<select name=type_robot><option value=1>1 – xe nâng</option><option value=2>2 – đội kệ</option></select></label>
     <label class="fl">Type_Move<select name=type_move>${[[11, 'chuyển vị trí'], [12, 'cất vào kệ'], [3, 'cất pallet định danh'], [1, 'cất pallet băng tải'], [2, 'gọi pallet rỗng'],
       [4, 'xuất ra bãi'], [5, 'châm hàng xuất'], [6, 'xuất lên băng chuyền'], [7, 'xuất NVL'], [10, 'move to băng chuyền'], [13, 'cất NVL dư'], [15, 'chuyển nội bộ']]
       .map(([v, n]) => `<option value=${v}>${v} – ${n}</option>`).join('')}</select></label>
     <button class="p">Gửi lệnh</button></form></div>`;
  }
  if (t === 'new_do') {
    const ps = (await api('/api/pallets')).filter(p => p.status === 'STORED' && p.ctn_total > p.ctn_shipped);
    return `<div class="card"><h3>Xuất hàng lên băng tải</h3><div class="hint">Tick pallet cần xuất, sửa số thùng cần xuất (mặc định: hết số thùng còn lại).</div>
    <form class="f" onsubmit="send(event,'/api/export',doBuild)" style="flex-direction:column;align-items:stretch">
     <div class="row"><label class="fl">Băng tải<select name=belt>${lineOpts('BCXB')}</select></label><button class="p">Gửi lệnh</button></div>
     <div class="tw"><table id="dop"><thead><tr><th></th><th>Pallet</th><th>SP</th><th>Vị trí</th><th class="num">Còn</th><th>Cần xuất</th></tr></thead><tbody>
     ${ps.map(p => `<tr data-p="${esc(p.pallet_id)}"><td><input type="checkbox"></td><td>${esc(p.pallet_id)}</td><td>${esc(p.item_code)}</td><td>${esc(p.location)}</td>
       <td class="num">${p.ctn_total - p.ctn_shipped}</td><td><input type="number" min="1" max="${p.ctn_total - p.ctn_shipped}" value="${p.ctn_total - p.ctn_shipped}" style="min-width:70px;width:80px"></td></tr>`).join('')
       || '<tr><td colspan=6 class="empty">Chưa có pallet trong kho</td></tr>'}</tbody></table></div></form></div>`;
  }
  if (t === 'orders') return table(await api('/api/orders'), [['Tạo', 'created_at'], ['Lệnh', 'order_id'], ['Loại', 'kind'], ['Line', 'line_id'],
    ['Trạng thái', r => badge(r.status)], ['Pallet', r => esc((r.pallets || [r.pallet_id]).join(', '))], ['Xong', r => esc((r.done || []).join(', '))],
    ['Kết quả Move', r => esc(Object.values(r.results || {}).join(', '))], ['Lỗi', 'error']]);
  if (t === 'pallets') return table(await api('/api/pallets'), [['Tạo', 'created_at'], ['Pallet', 'pallet_id'], ['SP', 'item_code'],
    ['Trạng thái', r => badge(r.status)], ['Vị trí', 'location'], ['Ô đã gán', 'assigned_location'], ['Thùng', 'ctn_total', 'num'],
    ['Đã xuất', 'ctn_shipped', 'num'], ['Lệnh', 'order_id']]);
  if (t === 'locs') {
    const rows = await api('/api/locations');
    return '<div class=grid>' + rows.map(l => `<div class="cell ${l.state}" data-tip="${esc(l.zone)} · ${esc(l.state)} ${esc(l.task || '')}"><b>${esc(l.code)}</b><br>${badge(l.state)}<br>${esc(l.pallet_id || '')}</div>`).join('') + '</div>';
  }
  if (t === 'events') return table(await api('/api/events'), [['Giờ', 't'], ['Sự kiện', 'text']]);
  if (t === 'outbox') return table(await api('/api/outbox'), [['Tạo', 'created_at'], ['Key', 'key'], ['Trạng thái', r => badge(r.status)], ['Lần', 'tries', 'num'], ['Lỗi cuối', 'last_error']]);
  if (t === 'msg') return msgTable(await api('/api/messages'));
  if (t === 'cfg') {
    const S = await api('/api/settings'), c = S.config, locd = await api('/api/locations/def');
    return `<form id="cfg" onsubmit="return false"><div class="grid2">
     <div class="card"><h3>Kết nối WCS</h3><div class="row">
      ${fld('URL WCS', 'wcs.url', c.wcs.url, 'str', 'style="min-width:260px"')}${fld('WH_Code', 'wh_code', c.wh_code)}</div></div>
     <div class="card"><h3>Lưu kho</h3><div class="row">
      ${fld('Zone lưu trữ', 'locations.store_zone', c.locations.store_zone)}
      ${fld('Tự gọi robot cất kệ khi định danh xong', 'auto_putaway', c.auto_putaway, 'bool')}
      ${fld('Robot cất kệ (1 xe nâng / 2 đội kệ)', 'putaway_robot', c.putaway_robot, 'num')}</div></div>
    </div>
    <div class="grid2">
     <div class="card"><h3>Tài khoản API cho WCS (TKELog Login)</h3>
      ${editTable('ut', Object.entries(c.users).map(([user, password]) => ({user, password})), [['user', 'User_Name', 'str'], ['password', 'Password', 'str']])}
      <div class="row" style="margin-top:10px">${fld('Token hết hạn sau (phút)', 'token_minutes', c.token_minutes, 'num')}</div></div>
     <div class="card"><h3>Line → điểm sàn</h3><div class="hint">Điểm robot lấy pallet ở bàn định danh / trả pallet ở băng tải.</div>
      ${editTable('stt', Object.entries(c.stations).map(([line_id, location]) => ({line_id, location})), [['line_id', 'Line_ID / Conveyor_Belt', 'str'], ['location', 'Điểm sàn', 'str']])}</div>
    </div>
    <div class="card"><h3>Khác</h3><div class="row">
      ${fld('Gửi lại sau (s)', 'outbox.retry_s', c.outbox.retry_s, 'num')}${fld('Timeout gửi (s)', 'outbox.timeout_s', c.outbox.timeout_s, 'num')}
      ${fld('Giữ bản tin (ngày)', 'messages_keep_days', c.messages_keep_days, 'num')}</div>
      <div class="hint" style="margin-top:10px">Cổng ${S.server.port}, MongoDB ${esc(S.mongo.uri)} / ${esc(S.mongo.db)}: sửa trong ${esc(S.file)} rồi chạy lại run_wms.bat.</div></div>
    <div class="savebar"><button type="button" class="p" onclick="saveCfg()">Lưu và áp dụng</button><span class="hint">Ghi ${esc(S.file)} (giữ bản .bak), áp dụng ngay.</span></div>
    </form>${locationEditor(locd)}`;
  }
});
</script>
</body></html>
